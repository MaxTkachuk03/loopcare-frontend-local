name: loopcare_frontend
version: 1.2.1+187
publish_to: none
description: Lean on me
environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  advertising_id:
    path: ./local_plugins/advertising_id
  auto_route: 5.0.4
  auto_size_text: ^3.0.0
  autoscale_tabbarview: ^1.0.2
  badges: ^3.1.2
  bloc_concurrency: ^0.2.2
  cached_network_image: ^3.3.0
  circular_countdown_timer: ^0.2.3
  collection: 1.18.0
  connectivity_plus: ^5.0.2
  cupertino_icons: ^1.0.6
  customer_io: ^1.3.1
  dart_code_metrics: ^5.7.6
  dart_jsonwebtoken: ^2.12.1
  dartz: ^0.10.1
  device_info_plus: 8.1.0
  dio: ^5.4.0
  easy_localization: ^3.0.3
  email_validator: 2.1.17
  fast_immutable_collections: ^9.2.0
  firebase_analytics: 10.7.0
  firebase_core: 2.27.2
  firebase_crashlytics: 3.4.20
  firebase_messaging: 14.7.21
  firebase_performance: 0.9.3+19
  flutter_udid: ^3.0.0
  flash: ^3.1.0
  flutter_bloc: ^8.1.3
  flutter_dotenv: ^5.1.0
  flutter_chat_ui: ^1.6.10
  flutter_polygon: ^0.3.0+2
  flutter_secure_storage: 8.1.0
  flutter_svg: ^2.0.9
  flutter_widget_from_html: ^0.14.9
  freezed_annotation: ^2.4.1
  get_it: ^7.6.4
  hydrated_bloc: ^9.1.2
  injectable: ^2.3.2
  image_picker: ^1.0.0
  intl: ^0.18.1
  in_app_purchase: ^3.1.13
  json_annotation: ^4.8.1
  just_audio: ^0.9.37
  just_audio_background: ^0.0.1-beta.11
  lint: 2.0.1
  mime: ^1.0.4
  mixpanel_analytics: 2.1.1
  mixpanel_flutter: ^2.2.0
  flutter_native_splash: ^2.4.0
  package_info_plus: ^3.1.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  pretty_dio_logger: 1.3.1
  provider: ^6.1.1
  open_filex: ^4.3.2
  qr_code_scanner: ^1.0.1
  rive: ^0.12.3
  rxdart: ^0.27.7
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.2.2
  socket_io_client: 2.0.3+1
  timezone: ^0.9.2
  app_tracking_transparency: ^2.0.4
  uuid: ^3.0.7
  url_launcher: ^6.2.1
  video_player: ^2.8.1
  wakelock: ^0.6.2
  ntp: ^2.0.0
  flutter:
    sdk: flutter
  flutter_zoom_videosdk:
    path: ./local_plugins/zoom_video_sdk_update
  bubble: ^1.2.1
  moment_dart: ^1.1.0
  appsflyer_sdk: ^6.14.2
  shimmer: ^3.0.0

dev_dependencies:
  analyzer: ^5.13.0
  auto_route_generator: ^5.0.3
  build_runner: ^2.4.7
  dart_code_metrics_presets: ^1.0.1
  flutter_lints: ^3.0.1
  freezed: ^2.4.5
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  pubspec_dependency_sorter: ^1.0.4
  test: ^1.24.9
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/
    - assets/icons/
    - assets/audio/
    - assets/animations/
    - assets/images/
    - assets/translations/
    - .env.dev
    - .env.stag
    - .env.uat
    - .env.prod
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-SemiBoldItalic.ttf
          style: italic
          weight: 600
    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter-Regular.ttf
        - asset: assets/fonts/Bitter-Italic.ttf
          style: italic
        - asset: assets/fonts/Bitter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Bitter-SemiBoldItalic.ttf
          style: italic
          weight: 600
  uses-material-design: true

flutter_native_splash:
  color: "#aeca5f"
  image: assets/images/app_logo.png

  android_12:
    image: assets/images/android_splash_logo.png
    color: "#aeca5f"