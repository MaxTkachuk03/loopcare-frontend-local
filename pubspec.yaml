name: loopcare_frontend
version: 1.5.0+217
publish_to: none
description: Lean on me
environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  advertising_id:
    path: ./local_plugins/advertising_id
  app_tracking_transparency: ^2.0.4
  appsflyer_sdk: ^6.14.3
  auto_route: 8.1.3
  auto_size_text: ^3.0.0
  autoscale_tabbarview: ^1.0.2
  badges: ^3.1.2
  bloc_concurrency: ^0.2.2
  bubble: ^1.2.1
  cached_network_image: ^3.3.0
  circular_countdown_timer: ^0.2.3
  collection: 1.18.0
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.6
  customer_io: ^1.4.0
  dart_jsonwebtoken: ^2.12.1
  dartz: ^0.10.1
  device_info_plus: 10.1.0
  dio: ^5.5.0+1
  easy_localization: ^3.0.3
  email_validator: 2.1.17
  facebook_app_events: ^0.19.2
  fast_immutable_collections: ^10.2.4
  firebase_analytics: 11.0.0
  firebase_core: 3.0.0
  firebase_crashlytics: 4.0.0
  firebase_messaging: 15.0.0
  firebase_performance: 0.10.0
  flash: ^3.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_bloc: ^8.1.3
  flutter_chat_ui: ^1.6.10
  flutter_dotenv: ^5.1.0
  flutter_native_splash: ^2.4.0
  flutter_polygon: ^0.3.0+2
  flutter_secure_storage: 9.2.2
  flutter_slidable: ^3.1.0
  flutter_svg: ^2.0.10+1
  flutter_timezone: ^2.1.0
  flutter_udid: ^3.0.0
  flutter_uxcam: ^2.5.2
  flutter_widget_from_html: ^0.15.0
  flutter_zoom_videosdk:
    path: ./local_plugins/zoom_video_sdk_update
  freezed_annotation: ^2.4.1
  get_it: ^7.6.4
  http_parser: ^4.0.2
  hydrated_bloc: ^9.1.2
  image_cropper: ^7.1.0
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.0
  injectable: ^2.3.2
  intl: ^0.19.0
  json_annotation: ^4.8.1
  just_audio: ^0.9.39
  just_audio_background: ^0.0.1-beta.13
  lint: 2.3.0
  logger: ^2.3.0
  lottie: ^3.1.2
  mime: ^1.0.4
  mixpanel_flutter: ^2.2.0
  moment_dart: ^2.1.0
  ntp: ^2.0.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  pretty_dio_logger: 1.3.1
  provider: ^6.1.1
  qr_code_scanner: ^1.0.1
  rive: ^0.12.3
  rxdart: ^0.27.7
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  socket_io_client: 2.0.3+1
  timezone: ^0.9.2
  url_launcher: ^6.2.1
  uuid: ^4.4.0
  video_player: ^2.8.1
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.2.5

dev_dependencies:
  auto_route_generator: 8.0.0
  build_runner: ^2.4.10
  dart_code_metrics_presets: ^2.13.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  injectable_generator: ^2.6.1
  json_serializable: ^6.7.1
  license_generator: ^2.0.0
  pubspec_dependency_sorter: ^1.0.4

flutter:
  assets:
    - assets/
    - assets/icons/
    - assets/audio/
    - assets/animations/
    - assets/images/
    - assets/translations/
    - .env.dev
    - .env.stag
    - .env.uat
    - .env.prod
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-SemiBoldItalic.ttf
          style: italic
          weight: 600
    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter-Regular.ttf
        - asset: assets/fonts/Bitter-Italic.ttf
          style: italic
        - asset: assets/fonts/Bitter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Bitter-SemiBoldItalic.ttf
          style: italic
          weight: 600
    - family: AppIcons
      fonts:
      - asset: assets/fonts/AppIcons.ttf
  uses-material-design: true
  shaders:
    - shaders/river_stream_shader.glsl

flutter_native_splash:
  color: "#ecf5ff"
  image: assets/images/app_logo.png

  android_12:
    image: assets/images/android_splash_logo.png
    color: "#ecf5ff"

license_generator:
  output_path: ./license_dependencies.dart


scripts:
  testflight:
    uat: "bundle exec fastlane ios testflight_distribution --env uat"
    prod: "bundle exec fastlane ios testflight_distribution --env prod"
  playstore:
    prod: "bundle exec fastlane android play_store_distribution --env prod"
  firebase:
    ios:
      dev: "bundle exec fastlane ios firebase_distribution --env dev"
      stag: "bundle exec fastlane ios firebase_distribution --env stag"
      uat: "bundle exec fastlane ios firebase_distribution --env uat"
      prod: "bundle exec fastlane ios firebase_distribution --env prod"
    android:
      dev: "bundle exec fastlane android firebase_distribution --env dev"
      stag: "bundle exec fastlane android firebase_distribution --env stag"
      uat: "bundle exec fastlane android firebase_distribution --env uat"
      prod: "bundle exec fastlane android firebase_distribution --env prod"