name: loopcare_frontend
description: A new Flutter project.

publish_to: 'none'

version: 1.0.15+66

environment:
  sdk: '>=2.18.4 <3.0.0'

dependencies:
  auto_route: ^5.0.4
  auto_size_text: ^3.0.0
  collection: 1.17.0
  cupertino_icons: ^1.0.2
  easy_localization: ^3.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.1
  dart_code_metrics: ^5.6.0
  dio: ^4.0.6
  pretty_dio_logger: 1.2.0-beta-1
  hydrated_bloc: ^9.0.0
  json_annotation: ^4.8.1
  freezed_annotation: ^2.2.0
  dartz: ^0.10.1
  get_it: ^7.2.0
  injectable: ^2.1.0
  lint: 2.0.1
  shared_preferences: 2.0.15
  flash: ^2.0.5
  flutter_polygon: ^0.3.0+2
  path_provider: ^2.0.11
  flutter_svg: ^2.0.0
  email_validator: 2.1.17
  flutter_dotenv: ^5.0.2
  firebase_core: ^2.5.0
  fast_immutable_collections: ^8.2.0
  qr_code_scanner: ^1.0.1
  package_info_plus: ^3.1.0
  rxdart: ^0.27.7
  scrollable_positioned_list: ^0.3.5
  cached_network_image: ^3.2.3
  flutter_widget_from_html: ^0.10.1
  audioplayers: 4.0.1
  rive: ^0.11.0
  video_player: ^2.6.1
  wakelock: ^0.6.2
  circular_countdown_timer: ^0.2.3
  bloc_concurrency: ^0.2.2
  timezone: ^0.9.2
  firebase_analytics: ^10.4.4
  firebase_crashlytics: ^3.3.4
  dart_jsonwebtoken: ^2.4.2
  permission_handler: ^10.4.3
  flutter_zoom_videosdk:
    path: ./local_plugins/zoom_video_sdk

dev_dependencies:
  build_runner: ^2.3.2
  auto_route_generator: ^5.0.3
  dart_code_metrics_presets: ^1.4.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.5.4
  freezed: ^2.3.2
  injectable_generator: ^2.1.3
  test: 1.22.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/animations/
    - assets/images/
    - assets/translations/
    - .env.dev
    - .env.prod

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-SemiBoldItalic.ttf
          style: italic
          weight: 600
    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter-Regular.ttf
        - asset: assets/fonts/Bitter-Italic.ttf
          style: italic
        - asset: assets/fonts/Bitter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Bitter-SemiBoldItalic.ttf
          style: italic
          weight: 600
