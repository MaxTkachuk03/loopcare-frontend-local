name: loopcare_frontend
version: 1.0.30+115
publish_to: none
description: Lean on me
environment: 
  sdk: '>=2.18.4 <3.0.0'

dependencies: 
  auto_route: 5.0.4
  auto_size_text: ^3.0.0
  bloc_concurrency: ^0.2.2
  cached_network_image: ^3.2.3
  circular_countdown_timer: ^0.2.3
  collection: 1.17.0
  connectivity_plus: 5.0.1
  cupertino_icons: ^1.0.2
  dart_code_metrics: ^5.6.0
  dart_jsonwebtoken: ^2.4.2
  dartz: ^0.10.1
  device_info_plus: 8.1.0
  dio: ^5.3.4
  easy_localization: ^3.0.1
  email_validator: 2.1.17
  fast_immutable_collections: ^8.2.0
  firebase_analytics: ^10.4.4
  firebase_core: ^2.5.0
  firebase_crashlytics: ^3.3.4
  firebase_performance: 0.9.0+14
  flash: ^2.0.5
  flutter_bloc: ^8.1.1
  flutter_dotenv: ^5.0.2
  flutter_polygon: ^0.3.0+2
  flutter_svg: ^2.0.0
  fluttertoast: 8.2.4
  flutter_widget_from_html: ^0.10.1
  freezed_annotation: ^2.2.0
  get_it: ^7.2.0
  hydrated_bloc: ^9.0.0
  injectable: ^2.1.0
  json_annotation: ^4.8.1
  lint: 2.0.1
  mixpanel_analytics: 2.1.1
  mixpanel_flutter: 2.1.1
  package_info_plus: ^3.1.0
  path_provider: ^2.0.11
  permission_handler: ^10.4.3
  pretty_dio_logger: 1.3.1
  provider: ^6.1.1
  qr_code_scanner: ^1.0.1
  rive: ^0.11.0
  rxdart: ^0.27.7
  scrollable_positioned_list: ^0.3.5
  shared_preferences: 2.0.15
  socket_io_client: 2.0.3+1
  timezone: ^0.9.2
  uuid: 3.0.7
  url_launcher: ^6.1.11
  video_player: ^2.6.1
  wakelock: ^0.6.2
  flutter: 
    sdk: flutter
  flutter_zoom_videosdk: 
    path: ./local_plugins/zoom_video_sdk_update
  gap: ^3.0.1

dev_dependencies: 
  auto_route_generator: ^5.0.3
  build_runner: ^2.3.2
  dart_code_metrics_presets: ^1.4.1
  flutter_lints: ^2.0.0
  freezed: ^2.3.2
  injectable_generator: ^2.1.3
  json_serializable: ^6.5.4
  pubspec_dependency_sorter: ^1.0.4
  test: 1.22.0
  flutter_test: 
    sdk: flutter

flutter: 
  assets: 
    - assets/
    - assets/icons/
    - assets/audio/
    - assets/animations/
    - assets/images/
    - assets/translations/
    - .env.dev
    - .env.prod
    - .env.stag
  fonts:
    - 
      family: OpenSans
      fonts: 
        - 
          asset: assets/fonts/OpenSans-Regular.ttf
        - 
          asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - 
          asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - 
          asset: assets/fonts/OpenSans-SemiBoldItalic.ttf
          style: italic
          weight: 600
    - 
      family: Bitter
      fonts: 
        - 
          asset: assets/fonts/Bitter-Regular.ttf
        - 
          asset: assets/fonts/Bitter-Italic.ttf
          style: italic
        - 
          asset: assets/fonts/Bitter-SemiBold.ttf
          weight: 600
        - 
          asset: assets/fonts/Bitter-SemiBoldItalic.ttf
          style: italic
          weight: 600
  uses-material-design: true
