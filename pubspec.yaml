name: loopcare_frontend
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.2
  easy_localization: ^3.0.1
  auto_route: ^5.0.4
  flutter_bloc: ^8.1.1
  dio: ^4.0.6
  pretty_dio_logger: 1.2.0-beta-1
  hydrated_bloc: ^9.0.0
  json_annotation: ^4.7.0
  freezed_annotation: ^2.2.0
  dartz: ^0.10.1
  get_it: ^7.2.0
  injectable: ^2.1.0
  shared_preferences: ^2.0.15
  flash: ^2.0.5
  flutter_polygon: ^0.3.0+2
  path_provider: ^2.0.11
  flutter_svg: ^1.1.6
  email_validator: 2.1.17
  flutter_dotenv: ^5.0.2
  firebase_core: ^2.5.0
  fast_immutable_collections: ^8.2.0

dev_dependencies:
  build_runner: ^2.3.2
  auto_route_generator: ^5.0.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.5.4
  freezed: ^2.3.2
  injectable_generator: ^2.1.3

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/translations/
    - .env.dev
    - .env.prod

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-SemiBoldItalic.ttf
          style: italic
          weight: 600
    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter-Regular.ttf
        - asset: assets/fonts/Bitter-Italic.ttf
          style: italic
        - asset: assets/fonts/Bitter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Bitter-SemiBoldItalic.ttf
          style: italic
          weight: 600
